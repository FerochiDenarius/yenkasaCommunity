name: yenkasacommunity
description: "A next-gen community engagement app with rewards and chat (YenkasaChat)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # --- COMMUNITY / CHAT FEATURES ---
  flutter_colorpicker: ^1.1.0         # Color picker for chat background
  image_picker: ^1.0.7                # Pick images for profile or wallpaper
  shared_preferences: ^2.3.3          # Save user settings (e.g. selected wallpaper)
  web_socket_channel: ^3.0.1          # Real-time WebSocket for chat
  provider: ^6.1.2                    # State management
  http: ^1.2.2                        # API connections for posts, rewards, etc.
  intl: ^0.19.0                       # Date formatting
  path_provider: ^2.1.3               # File system paths
  file_picker: ^8.1.2                 # Attach files in chat
  permission_handler: ^11.3.1         # Request permissions (photos, storage, mic)
  fluttertoast: ^8.2.6                # Toast notifications
  cached_network_image: ^3.4.1        # Optimized network image loading
  record: ^5.1.1
  audioplayers: ^6.1.0
  webview_flutter: ^4.7.0
  wakelock_plus: ^1.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # --- IMAGES / ASSETS ---
  assets:
    - assets/images/
    - assets/icons/

  # --- CUSTOM FONTS (OPTIONAL) ---
  # Uncomment and replace with your chosen fonts later
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
